aid: concepts
name: Concepts
description: >-
  Concepts is a digital sketching and design application built by TopHatch, Inc.,
  offering an infinite, flexible canvas for thinking, planning, illustration, and
  design across iOS, Android, and Windows. It blends vector and raster drawing with
  precision tools, adjustable brushes, layers, and a dynamic tool wheel aimed at
  designers, illustrators, architects, and product teams. Concepts was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network. As a
  consumer creative application it publishes no public developer API, OpenAPI, SDKs,
  or agent surface at this time; this profile captures its identity and public web
  properties along with a domain-security probe.
